# Local development database. Copy .env.example to .env and set POSTGRES_PASSWORD first.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ict_payment_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ict_payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
